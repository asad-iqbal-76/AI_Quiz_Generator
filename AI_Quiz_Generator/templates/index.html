<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-900 min-h-screen font-inter text-gray-100 overflow-x-hidden">
    <!-- Animated Background -->
    <div class="fixed inset-0 z-0">
        <div class="animated-bg"></div>
    </div>

    <!-- Navbar -->
    <nav class="bg-white/10 backdrop-blur-lg shadow-lg sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a class="text-3xl font-bold text-white font-poppins bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-indigo-500" href="#">AI Quiz Generator</a>
            <div class="space-x-6">
                <a href="#" class="text-gray-200 hover:text-pink-400 transition-colors">Home</a>
                <a href="#" class="text-gray-200 hover:text-pink-400 transition-colors">About</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="relative">
        <div class="container mx-auto px-4 py-16 text-center">
            <h1 class="text-5xl font-bold font-poppins text-white mb-4 animate-fade-in">Create Stunning Quizzes Instantly</h1>
            <p class="text-lg text-gray-300 max-w-2xl mx-auto animate-fade-in-delay">Generate custom quizzes with AI in seconds. Perfect for teachers, students, and professionals!</p>
        </div>
        <svg class="absolute bottom-0 w-full" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#ffffff" fill-opacity="0.1" d="M0,128L48,144C96,160,192,192,288,197.3C384,203,480,181,576,165.3C672,149,768,139,864,149.3C960,160,1056,192,1152,192C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>

    <!-- Form Section -->
    <div class="container mx-auto px-4 py-12 relative z-10">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 max-w-2xl mx-auto animate-slide-up">
            <h2 class="text-3xl font-bold font-poppins text-white mb-6 text-center">Generate Your Quiz</h2>
            <form id="questionForm" class="space-y-6">
                <div class="relative">
                    <input type="text" id="topic" class="w-full px-4 py-3 bg-gray-800/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent peer text-white placeholder-gray-400" placeholder=" ">
                    <label for="topic" class="absolute left-3 -top-2.5 text-sm text-gray-300 bg-gray-900 px-1 transition-all peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-pink-400">Topic or Context Text</label>
                </div>
                <div class="relative">
                    <input type="file" id="file" accept=".pdf,.txt" class="w-full px-4 py-3 bg-gray-800/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent peer text-white">
                    <label for="file" class="absolute left-3 -top-2.5 text-sm text-gray-300 bg-gray-900 px-1 transition-all">Upload PDF or Text File (Optional)</label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="difficulty" class="block text-sm font-medium text-gray-300 mb-1">Difficulty</label>
                        <select id="difficulty" class="w-full px-4 py-3 bg-gray-800/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent text-white">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                    <div>
                        <label for="qtype" class="block text-sm font-medium text-gray-300 mb-1">Question Type</label>
                        <select id="qtype" class="w-full px-4 py-3 bg-gray-800/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent text-white">
                            <option value="MCQ">Multiple Choice</option>
                            <option value="Short Answer">Short Answer</option>
                        </select>
                    </div>
                    <div>
                        <label for="num_questions" class="block text-sm font-medium text-gray-300 mb-1">Number of Questions</label>
                        <input type="number" id="num_questions" value="5" min="1" max="20" class="w-full px-4 py-3 bg-gray-800/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent text-white">
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button type="submit" id="generateBtn" class="bg-gradient-to-r from-pink-500 to-indigo-500 text-white px-6 py-3 rounded-lg hover:from-pink-600 hover:to-indigo-600 transition-all duration-300 transform hover:scale-105">Generate Questions</button>
                    <div id="spinner" class="h-6 w-6 border-4 border-pink-500 border-t-transparent rounded-full animate-spin hidden"></div>
                </div>
            </form>
        </div>

        <div id="questionsContainer" class="mt-12 space-y-6"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
